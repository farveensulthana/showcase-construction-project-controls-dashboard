@if (open) {
  <div class="modal-overlay" (mousedown)="onOverlayMouseDown()">
    <div
      #panel
      class="modal-panel modal-{{ size }}"
      role="dialog"
      aria-modal="true"
      [attr.aria-label]="title"
      tabindex="-1"
      (mousedown)="onPanelMouseDown($event)"
    >
      <div class="modal-header">
        <div>
          <h2 class="modal-title">{{ title }}</h2>
          @if (subtitle) {
            <p class="modal-subtitle">{{ subtitle }}</p>
          }
        </div>
        <button type="button" class="btn btn-ghost btn-icon btn-sm" (click)="closed.emit()" aria-label="Close">
          <i class="icon icon-x" aria-hidden="true"></i>
        </button>
      </div>
      <div class="modal-body">
        <ng-content></ng-content>
      </div>
      @if (hasFooter) {
        <div class="modal-footer">
          <ng-content select="[modal-footer]"></ng-content>
        </div>
      }
    </div>
  </div>
}
