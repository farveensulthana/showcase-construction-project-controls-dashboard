<div class="app-shell" [attr.data-theme]="theme()">
  <aside class="sidebar" [class.is-open]="menuOpen()">
    <div class="sidebar-brand">
      <i class="icon icon-building-2" aria-hidden="true"></i>
      <span>Construction</span>
    </div>
    <nav aria-label="Primary">
      <ul class="nav-list">
        @for (item of navItems; track item.id) {
          <li>
            <a
              [routerLink]="item.path"
              routerLinkActive="is-active"
              [routerLinkActiveOptions]="{ exact: item.path === '/' }"
              class="nav-item"
              (click)="closeMenu()"
            >
              <i class="icon icon-{{ item.icon }}" aria-hidden="true"></i>
              <span>{{ item.label }}</span>
            </a>
          </li>
        }
      </ul>
      <!-- <div class="nav-section-title">Management</div>
      <SidebarNav items={secondaryNav} onNavigate={closeMenu} /> -->
    </nav>
  </aside>

  <div class="sidebar-overlay" [class.is-visible]="menuOpen()" (click)="closeMenu()" aria-hidden="true"></div>

  <header class="topbar">
    <div class="topbar-left">
      <button
        type="button"
        class="btn btn-icon btn-ghost menu-toggle"
        (click)="toggleMenu()"
        aria-label="Toggle navigation menu"
        [attr.aria-expanded]="menuOpen()"
      >
        <i class="icon icon-menu" aria-hidden="true"></i>
      </button>
    </div>
    <div class="topbar-right">
      <button
        type="button"
        class="btn btn-icon btn-ghost"
        (click)="toggleTheme()"
        [attr.aria-label]="'Switch to ' + (theme() === 'light' ? 'dark' : 'light') + ' mode'"
        [title]="'Switch to ' + (theme() === 'light' ? 'dark' : 'light') + ' mode'"
      >
        <i class="icon icon-{{ theme() === 'light' ? 'moon' : 'sun' }}" aria-hidden="true"></i>
      </button>
      <button type="button" class="btn btn-icon btn-ghost" aria-label="Notifications">
        <i class="icon icon-bell" aria-hidden="true"></i>
      </button>
    </div>
  </header>

  <main class="main-content">
    <router-outlet></router-outlet>
  </main>
</div>
