<div class="site-map-page">
  <header class="page-header">
    <h1>Site Map</h1>
    <p>Project and site locations with construction activity markers</p>
  </header>

  @if (loading()) {
    <div class="loading-state" aria-live="polite">Loading site map…</div>
  }
  @if (error()) {
    <div class="alert alert-error" role="alert">{{ error() }}</div>
  }

  @if (!loading() && !error()) {
    <div class="card map-card">
      <ejs-maps id="site-map" [zoomSettings]="zoomSettings" [mapsArea]="mapsArea" [titleSettings]="titleSettings">
        <e-layers>
          <e-layer urlTemplate="https://tile.openstreetmap.org/level/tileX/tileY.png">
            <e-markerSettings>
              <e-markerSetting
                [dataSource]="locations()"
                [visible]="true"
                shape="Circle"
                [height]="20"
                [width]="20"
                fill="#1976d2"
                latitudeValuePath="latitude"
                longitudeValuePath="longitude"
                [tooltipSettings]="tooltipSettings"
              ></e-markerSetting>
            </e-markerSettings>
          </e-layer>
        </e-layers>
      </ejs-maps>
    </div>
  }
</div>
